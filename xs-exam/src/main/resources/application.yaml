spring:
  application:
    name: xs-exam

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xs-exam?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 1234

server:
  port: 8084

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true

# 文件存储统一由 xs-media 管理：作业附件存放在 local-root/homework 下
xingshu:
  storage:
    local-root: ${XINGSHU_UPLOAD_DIR:${user.home}/XingShuEnv/uploads}
    type: agc
    agc:
      bucket: "pdf-dwad8"
      region: cn-east-3
      credentials-file: ${XINGSHU_AGC_CREDENTIALS:${user.home}/XingShuEnv/agc-apiclient.json}