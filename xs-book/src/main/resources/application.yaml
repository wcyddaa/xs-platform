server:
  port: 8083

spring:
  application:
    name: xs-book

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  elasticsearch:
    # ES 开启安全认证（HTTP，无 TLS），本地开发默认账号 elastic / xingshu123
    uris: ${XINGSHU_ES_URI:http://localhost:9200}
    username: ${XINGSHU_ES_USERNAME:elastic}
    password: ${XINGSHU_ES_PASSWORD:xingshu123}

  ai:
    openai:
      base-url: https://api.siliconflow.cn
      # 仅占位，避免 Spring AI 自动配置因缺少 api-key 启动失败；
      # 真实密钥不落配置文件/环境变量，统一从 xs-config 的受保护内部接口读取
      api-key: not-configured
      embedding:
        options:
          model: BAAI/bge-m3

    vectorstore:
      elasticsearch:
        index-name: textbook_chunk_vector
        dimensions: 1024
        similarity: cosine

# 文件存储统一由 xs-media 管理：教材/课件/作业附件都在 local-root 下分类存放
xingshu:
  storage:
    # 默认用户目录下的 XingShuEnv，与启动工作目录无关
    local-root: ${XINGSHU_UPLOAD_DIR:${user.home}/XingShuEnv/uploads}
    type: agc
    agc:
      bucket: "pdf-dwad8"
      region: cn-east-3
      # 凭据放在仓库外，可用环境变量 XINGSHU_AGC_CREDENTIALS 覆盖
      credentials-file: ${XINGSHU_AGC_CREDENTIALS:${user.home}/XingShuEnv/agc-apiclient.json}