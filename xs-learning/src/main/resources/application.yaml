spring:
  application:
    name: xs-learning

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xs-learning?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1234

server:
  port: 8087

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true

# 智能体评分与作业服务地址
ai:
  ability-score-url: http://localhost:8000/api/student-insight/score

xs:
  exam:
    base-url: http://localhost:8084