server:
  port: 8081

spring:
  application:
    name: xs-auth
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  datasource:
    url: jdbc:mysql://localhost:3306/xs-user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  openapi:
    title: xs-auth 认证服务接口文档
    description: 星枢平台 - 认证与权限管理服务
    version: 1.0.0
    group-name: auth