server:
  port: 8089

spring:
  application:
    name: xs-media

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# 云存储配置
xingshu:
  storage:
    local-root: ${XINGSHU_UPLOAD_DIR:${user.home}/XingShuEnv/uploads}
    type: agc
    agc:
      bucket: "pdf-dwad8"
      region: cn-east-3
      credentials-file: ${XINGSHU_AGC_CREDENTIALS:${user.home}/XingShuEnv/agc-apiclient.json}